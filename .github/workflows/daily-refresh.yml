name: Daily Delivery Map Refresh
on:
  schedule:
    - cron: "0 14 * * 1-5"   # 14:00 UTC = 10:00 ET (EDT). Winter = 09:00 ET.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Skip on weekends / Ontario stat holidays
        id: guard
        run: python pipeline/ci_skip_guard.py

      - name: Setup Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install Python deps
        if: steps.guard.outputs.skip == 'false'
        run: |
          pip install -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Setup Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install wrangler + rclone
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm install -g wrangler
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Restore OSRM cache
        if: steps.guard.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: pipeline/osrm_cache.json
          key: osrm-cache-v1

      - name: Pull source xlsx from SharePoint
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -e
          mkdir -p _src
          rclone copy "ees:Unique Events/CMMC_UniqueEvents.xlsx"              ./_src/
          rclone copy "ees:Dispatch/CMMC_Dispatch_Routes.xlsx"               ./_src/
          rclone copy "ees:Payworks/Element Event Solutions - Timesheet.xlsx" ./_src/ || echo "WARN: Payworks missing"

      - name: Freshness check
        if: steps.guard.outputs.skip == 'false'
        run: python pipeline/ci_freshness_check.py _src

      - name: Run pipeline
        if: steps.guard.outputs.skip == 'false'
        env:
          MAP_PASSWORD: ${{ secrets.MAP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: bash pipeline/run_pipeline.sh

      - name: Save OSRM cache
        if: always() && steps.guard.outputs.skip == 'false'
        uses: actions/cache/save@v4
        with:
          path: pipeline/osrm_cache.json
          key: osrm-cache-v1
