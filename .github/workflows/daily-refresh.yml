name: Daily Delivery Map Refresh
on:
  schedule:
    # GitHub's `schedule` trigger is best-effort: runs at :00 are commonly delayed
    # 5-30+ min and can be DROPPED entirely. So we (a) run off the top of the hour
    # and (b) add a catch-up slot. A scheduled run exits in ~30s if today's data was
    # already published (see pipeline/ci_skip_guard.py); manual runs never skip.
    # Power Automate stages the source xlsx at 7:30 AM ET, so both slots have input.
    - cron: "17 12 * * *"    # 08:17 AM ET (EDT) — primary
    - cron: "17 13 * * *"    # 09:17 AM ET (EDT) — catch-up
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  # Cheap gate (~20s). A SCHEDULED run exits here if today's data is already
  # published, so the 09:17 catch-up no-ops when the 08:17 primary succeeded.
  # A manual workflow_dispatch NEVER skips, so Mark can always force a rebuild.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: python3 pipeline/ci_skip_guard.py

  refresh:
    needs: guard
    if: needs.guard.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install Python deps
        run: |
          pip install -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install wrangler + rclone
        run: |
          npm install -g wrangler
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Restore OSRM cache
        uses: actions/cache@v4
        with:
          path: pipeline/osrm_cache.json
          key: osrm-cache-v1

      - name: Pull source xlsx from Google Drive
        run: |
          set -e
          mkdir -p _src
          # Files are staged into this Drive folder daily by a Power Automate flow
          # (SharePoint -> Google Drive). One folder copy grabs all three xlsx.
          rclone copy "gdrive:Element Delivery Map Source" ./_src/
          ls -la _src/

      - name: Freshness check
        run: python pipeline/ci_freshness_check.py _src

      - name: Run pipeline
        env:
          MAP_PASSWORD: ${{ secrets.MAP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: bash pipeline/run_pipeline.sh

      - name: Save OSRM cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/osrm_cache.json
          key: osrm-cache-v1
