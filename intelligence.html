<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Element Delivery Map</title>
<link rel="icon" type="image/svg+xml" href="/assets/element-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --element-teal:#1C3B42; --element-teal-dark:#0F2428; --element-teal-mid:#2A5A63;
    --element-mint:#C0DEC7; --element-offwhite:#F7F3EC; --element-offwhite-tint:#CDC7B4;
    --element-white:#FFFFFF; --element-ink:#1C3B42; --element-muted:#6B7A7E; --element-border:#E3DED1;
    --green:#1B7F4B; --green-bg:#E4F3EA; --yellow:#B8860B; --yellow-bg:#FBF3DD; --red:#B23A3A; --red-bg:#F7E4E4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--element-ink);background:var(--element-offwhite);}
  a{color:var(--element-teal-mid);}
  .wrap{max-width:1320px;margin:0 auto;padding:18px 20px 60px;}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--element-border);padding-bottom:14px;margin-bottom:18px;}
  header img{height:34px;width:auto;}
  header .title{font-size:20px;font-weight:700;color:var(--element-teal);letter-spacing:.01em;}
  header .spacer{flex:1;}
  .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ctrl label{font-size:12px;font-weight:600;color:var(--element-muted);}
  input[type=date]{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--element-border);border-radius:8px;background:var(--element-white);color:var(--element-ink);}
  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--element-teal);background:var(--element-teal);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--element-teal-dark);}
  .btn.ghost{background:var(--element-white);color:var(--element-teal);}
  .btn.ghost:hover{background:var(--element-mint);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  /* BU chips — identical to the tracker */
  .bu-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  .bu-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--element-muted);margin-right:2px;}
  .bu-chip{padding:5px 12px;border-radius:999px;border:1.5px solid var(--element-border);background:var(--element-white);font-size:12.5px;font-weight:600;color:var(--element-ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s ease;}
  .bu-chip:hover{border-color:var(--element-teal-mid);}
  .bu-chip.active{background:var(--element-teal);color:#fff;border-color:var(--element-teal);}
  .bu-chip .bu-n{font-weight:700;opacity:.75;}
  /* KPI cards */
  .dash{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:1100px){ .dash{grid-template-columns:repeat(3,1fr);} }
  @media(max-width:640px){ .dash{grid-template-columns:repeat(2,1fr);} }
  .card{background:var(--element-white);border:1px solid var(--element-border);border-radius:12px;padding:13px 15px;}
  .card .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--element-muted);display:flex;justify-content:space-between;gap:6px;min-height:26px;}
  .card .v{font-size:24px;font-weight:700;color:var(--element-teal);margin-top:6px;line-height:1.05;font-variant-numeric:tabular-nums;}
  .card .csub{font-size:11px;margin-top:4px;font-weight:600;line-height:1.25;}
  /* banner */
  .banner{display:flex;gap:12px;align-items:center;background:var(--yellow-bg);border:1px solid #E6CE94;border-radius:12px;padding:11px 15px;margin-bottom:16px;}
  .banner .ico{font-size:16px;color:var(--yellow);}
  .banner .txt{font-size:13px;flex:1;}
  .banner .cov{font-size:11.5px;font-weight:700;color:var(--yellow);white-space:nowrap;}
  /* layout */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .grid-util{display:grid;grid-template-columns:.9fr 1.4fr;gap:16px;margin-bottom:16px;}
  @media(max-width:900px){ .grid2,.grid-util{grid-template-columns:1fr;} }
  .panel{background:var(--element-white);border:1px solid var(--element-border);border-radius:12px;padding:16px 18px;}
  .panel h3{font-size:12.5px;font-weight:700;color:var(--element-teal);margin:0;text-transform:uppercase;letter-spacing:.03em;}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
  .panel .psub{font-size:11.5px;color:var(--element-muted);margin:0 0 12px;}
  /* tables */
  table{border-collapse:collapse;width:100%;font-size:13px;}
  thead th{background:var(--element-teal);color:#fff;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 9px;text-align:left;white-space:nowrap;}
  thead th.num{text-align:right;}
  tbody td{padding:7px 9px;border-top:1px solid var(--element-border);white-space:nowrap;}
  tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody tr:nth-child(even){background:#FBFAF6;}
  tr.clickable{cursor:pointer;} tr.clickable:hover{background:var(--element-mint)!important;}
  tr.active-bu{background:var(--green-bg)!important;}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;}
  .tag.g{background:var(--green-bg);color:var(--green);} .tag.y{background:var(--yellow-bg);color:var(--yellow);} .tag.r{background:var(--red-bg);color:var(--red);} .tag.n{background:#ECEAE2;color:var(--element-muted);}
  .tbl-scroll{overflow-x:auto;}
  /* chart */
  .chart{position:relative;height:150px;}
  .chart .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:4px;}
  .chart .bar{flex:1;border-radius:3px 3px 0 0;overflow:hidden;transition:opacity .12s;cursor:pointer;}
  .chart .seg{width:100%;}
  .chart .tgt{position:absolute;left:0;right:0;border-top:1.5px dashed var(--element-muted);opacity:.6;pointer-events:none;}
  .chart .tip{position:absolute;top:-4px;transform:translate(-50%,-100%);z-index:6;background:var(--element-teal);color:#fff;border-radius:9px;padding:9px 11px;min-width:150px;pointer-events:none;box-shadow:0 8px 22px rgba(15,36,40,.3);display:none;}
  .chart .tip .d{font-size:10px;opacity:.7;font-weight:600;}
  .chart .tip .big{font-size:19px;font-weight:700;margin:1px 0 5px;font-variant-numeric:tabular-nums;}
  .chart .tip .row{display:flex;justify-content:space-between;gap:14px;font-size:11px;}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--element-muted);align-items:center;}
  .legend .sw{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle;}
  /* gauges */
  .gauge{margin-bottom:16px;}
  .gauge .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .gauge .lab .n{font-size:12px;font-weight:600;}
  .gauge .lab .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .gauge .track{height:11px;background:#ECEAE2;border-radius:7px;overflow:hidden;position:relative;}
  .gauge .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--element-muted);opacity:.6;}
  .gauge .fill{height:100%;border-radius:7px;}
  .gauge .note{margin-top:4px;padding:10px 12px;background:var(--element-offwhite);border-radius:9px;font-size:11.5px;color:var(--element-muted);}
  .barmini{height:9px;background:#ECEAE2;border-radius:6px;overflow:hidden;}
  .barmini>div{height:100%;border-radius:6px;background:var(--element-teal-mid);}
  .empty{padding:40px;text-align:center;color:var(--element-muted);}
  @media(max-width:640px){ header .title{font-size:17px;} .wrap{padding:14px 12px 50px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/assets/element-lockup.svg" alt="Element Event Solutions" onerror="this.style.display='none'">
    <div class="title">Dashboard</div>
    <div class="spacer"></div>
    <div class="ctrl">
      <label for="datePick">As of</label>
      <input type="date" id="datePick">
      <a class="btn ghost" href="/tracker.html" title="Open the Daily Truck Tracker">Tracker</a>
      <a class="btn ghost" href="/" title="Back to the delivery map">&larr; Map</a>
    </div>
  </header>
  <div id="content"><div class="empty" id="loadingMsg">Loading dispatch data&hellip;</div></div>
</div>

<script>
"use strict";

/* ============================== formatters ============================== */
const fmt0 = n => (n==null||isNaN(n))?'—':Math.round(n).toLocaleString('en-CA');
const money = n => (n==null||isNaN(n))?'—':'$'+Math.round(n).toLocaleString('en-CA');
const fmt1 = n => (n==null||isNaN(n))?'—':(Math.round(n*10)/10).toLocaleString('en-CA',{minimumFractionDigits:1,maximumFractionDigits:1});
const moneyK = n => { if(n==null||isNaN(n)) return '—'; const k=n/1000; return '$'+(k>=10?Math.round(k):(Math.round(k*10)/10))+'k'; };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================== config ============================== */
const TREND_DAYS = 28;
// Per-BU rev/truck-day target bands (starting estimates — confirm with real history).
const TARGETS = {'All':7000,'GTA':5000,'GTA Tents':20000,'West':9000,'East':8000,'Other':7000};
const BU_ORDER = ['GTA','GTA Tents','East','West','Other'];
const BU_CHIPS = [['All','All'],['GTA','GTA'],['GTA Tents','Tents'],['East','East'],['West','West']];
const OPS_MAXH = 140;

/* ============================== state + data ============================== */
let DATA=null, PW=null, PW_FULL=null, PW_INIT=null, LOAD=null;
let curDate=null;
const STATE = { bu:'All', hoverIdx:null, selDay:null };
let OPSCTX = null;  // {series,target,scopeLabel} — lets hover update the chart without a full re-render

const HS_TO_CO = {'001':'GTA','002':'GTA','003':'East','004':'GTA Tents','005':'West','006':'GTA','007':'West','008':'GTA','009':'GTA'};
function buOf(hs){ return HS_TO_CO[hs] || 'Other'; }
const STORE_TO_BU = {'CFR':'GTA','CMM':'GTA','ERG':'GTA','HIG':'GTA','ATR':'GTA Tents','RT':'GTA Tents','MFL':'East','A&B':'West','LW':'West'};
function cubeOf(con){ return (LOAD&&LOAD.cube_by_con&&LOAD.cube_by_con[con])||0; }
function capOf(bu){ return (LOAD&&LOAD.capacity_by_bu&&LOAD.capacity_by_bu[bu])||0; }
function isUnassigned(t){ return /^No truck assigned/i.test(String(t&&(t.truckLabel||t.truck)||'')); }

const PW_ALIASES = { 'JOEY SARMIENTO': 'HUSEP SARMIENTO' };
function normToks(s){ return String(s||'').replace(/\([^)]*\)/g,'').toUpperCase().replace(/[^A-Z ]/g,' ').split(/\s+/).filter(Boolean); }
function buildPwIndex(){
  PW_FULL=new Map(); PW_INIT=new Map();
  if(!PW||!PW.drivers) return;
  for(const rec of PW.drivers){
    const fn=normToks(rec.f).join(' '), ln=normToks(rec.l).join(' ');
    if(!fn) continue;
    const full=(fn+' '+ln).trim();
    if(!PW_FULL.has(full)) PW_FULL.set(full, rec);
    if(ln && !PW_INIT.has(fn+'|'+ln[0])) PW_INIT.set(fn+'|'+ln[0], rec);
  }
}
function pwMatch(driver){
  if(!PW_FULL) return null;
  const t=normToks(driver); if(!t.length) return null;
  const alias=PW_ALIASES[t.join(' ')]; if(alias){ const ar=PW_FULL.get(alias); if(ar) return ar; }
  const fn=t[0], ln=t.slice(1).join(' ');
  let r=PW_FULL.get((fn+' '+ln).trim()); if(r) return r;
  if(t.length>=2){ r=PW_FULL.get(fn+' '+t[t.length-1]); if(r) return r; }
  if(t.length>=2){ r=PW_INIT.get(fn+'|'+t[1][0]); if(r) return r; }
  return null;
}
function pwHoursFor(driver, isoDate){
  const r=pwMatch(driver); if(!r||!r.d) return null;
  const h=r.d[isoDate]; return (typeof h==='number')?h:null;
}

// aggregate routes -> per-truck rows for a date. Memoized by date so re-renders
// (hover/click/filter) reuse the parse instead of re-walking ~21MB of routes.
const AGG_CACHE={};
function aggregate(d){ return AGG_CACHE[d] || (AGG_CACHE[d]=aggregateRaw(d)); }
function aggregateRaw(d){
  const rts=(DATA.routes&&DATA.routes[d])?DATA.routes[d]:[];
  const byTruck={};
  for(const r of rts){
    const t=(r.tnum||r.truck||'').toString().replace(/^#/,'').trim();
    if(!t) continue;
    if(!byTruck[t]) byTruck[t]={truck:t, truckLabel:String(r.truck||r.tnum||t), driver:'', rev:0, revD:0, revP:0, stops:0, hs:'', bu:'Other', dCube:0, pCube:0, _sv:{}, _locs:new Set(), fillBU:null};
    const o=byTruck[t];
    o.rev += (r.stops||[]).reduce((s,x)=>s+(x.rev||0),0);
    for(const s of (r.stops||[])){
      const rv=s.rev||0; if(s.cls==='D') o.revD+=rv; else if(s.cls==='P') o.revP+=rv;
      let locKey=normAddr(s.addr);
      if(!locKey && Array.isArray(s.ll) && s.ll[0]!=null && s.ll[1]!=null) locKey='ll:'+(+s.ll[0]).toFixed(4)+','+(+s.ll[1]).toFixed(4);
      if(locKey) o._locs.add(locKey);
      const sc=String(s.store||'').trim().toUpperCase();
      if(STORE_TO_BU[sc]) o._sv[STORE_TO_BU[sc]]=(o._sv[STORE_TO_BU[sc]]||0)+1;
      const con=(s.con==null?'':String(s.con)).trim();
      if(con && LOAD){ const cube=cubeOf(con); if(cube>0){ if(s.cls==='D') o.dCube+=cube; else if(s.cls==='P') o.pCube+=cube; } }
    }
    if(!o.driver && r.drv) o.driver=r.drv;
    if((!o.hs||o.bu==='Other') && r.hs!=null && String(r.hs).trim()){ o.hs=String(r.hs).trim(); o.bu=buOf(o.hs); }
    // BU fallback when hs is blank (synthetic "No truck assigned (XXX)" virtual
    // routes): the payload stamps the bucket on r.co, so they land in their real BU.
    if(o.bu==='Other' && r.co && String(r.co).trim()) o.bu=String(r.co).trim();
  }
  const arr=Object.values(byTruck);
  arr.forEach(o=>{ let best=null,bn=-1; for(const k in o._sv){ if(o._sv[k]>bn){best=k;bn=o._sv[k];} } o.fillBU=best||(o.bu!=='Other'?o.bu:null); delete o._sv;
    o.stops=o._locs.size; delete o._locs;
    const cap=capOf(o.fillBU); o.dFill=cap?Math.round(100*o.dCube/cap):null; o.pFill=cap?Math.round(100*o.pCube/cap):null; });
  return arr;
}
function normAddr(a){ return String(a||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }

/* ============================== date helpers ============================== */
const WK=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function addDays(iso, n){ const p=iso.split('-').map(Number); const dt=new Date(p[0],p[1]-1,p[2]+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function localToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateLabel(iso){ const p=iso.split('-').map(Number); const d=new Date(p[0],p[1]-1,p[2]); return WK[d.getDay()]+' '+String(p[2]).padStart(2,'0')+' '+MO[p[1]-1]; }
function dateLong(iso){ const p=iso.split('-').map(Number); const d=new Date(p[0],p[1]-1,p[2]); return WK[d.getDay()]+' '+String(p[2]).padStart(2,'0')+' '+MO[p[1]-1]+' '+p[0]; }

/* ============================== metrics ==============================
   Convention: a solo revenue number = DELIVERED revenue (rev_d). Rev/truck-day
   is delivered revenue ÷ active trucks. */
function scopeMetrics(bu){
  const all=aggregate(curDate);
  const ts = (bu==='All') ? all : all.filter(t=>t.bu===bu);
  const trucks=ts.length;
  const revD=ts.reduce((s,t)=>s+(t.revD||0),0);
  const revP=ts.reduce((s,t)=>s+(t.revP||0),0);
  const stops=ts.reduce((s,t)=>s+t.stops,0);
  const fillT=ts.filter(t=>t.dFill!=null);
  const avgD=fillT.length?Math.round(fillT.reduce((s,t)=>s+(t.dFill||0),0)/fillT.length):null;
  const avgP=fillT.length?Math.round(fillT.reduce((s,t)=>s+(t.pFill||0),0)/fillT.length):null;
  const bh=(avgD&&avgD>0&&avgP!=null)?Math.round(avgP/avgD*100):null;
  let nHrs=0; ts.forEach(t=>{ const h=pwHoursFor(t.driver,curDate); if(h!=null&&h>0) nHrs++; });
  const cov=trucks?Math.round(100*nHrs/trucks):0;
  return {ts,trucks,revD,revP,revTd:trucks?revD/trucks:0,stops,stopsPer:trucks?stops/trucks:0,avgD,avgP,bh,cov,nHrs,target:TARGETS[bu]||TARGETS.All};
}

// 28-day delivered rev/truck-day series for a scope, with per-BU delivered split.
function buildSeries(scope){
  const out=[];
  for(let i=TREND_DAYS-1;i>=0;i--){
    const d=addDays(curDate,-i);
    const ts=aggregate(d);
    const byBU={}; let fleetRevD=0, fleetRevP=0;
    ts.forEach(t=>{ fleetRevD+=(t.revD||0); fleetRevP+=(t.revP||0); const b=(byBU[t.bu]=byBU[t.bu]||{revD:0,revP:0,trucks:0}); b.revD+=(t.revD||0); b.revP+=(t.revP||0); b.trucks++; });
    const fleetTrucks=ts.length;
    const scopeRevD = scope==='All'?fleetRevD:((byBU[scope]||{}).revD||0);
    const scopeRevP = scope==='All'?fleetRevP:((byBU[scope]||{}).revP||0);
    const scopeTrucks = scope==='All'?fleetTrucks:((byBU[scope]||{}).trucks||0);
    out.push({i:TREND_DAYS-1-i, iso:d, label:dateLabel(d), fleetRev:fleetRevD, fleetTrucks,
      scopeRev:scopeRevD, scopeRevP, scopeTrucks,
      revTd: scopeTrucks?scopeRevD/scopeTrucks:0,
      dTd: scopeTrucks?scopeRevD/scopeTrucks:0, pTd: scopeTrucks?scopeRevP/scopeTrucks:0});
  }
  return out;
}

/* ============================== CSV export ============================== */
function exportCsv(){
  const days=buildSeries('All');
  const target=TARGETS.All;
  const perBU=days.map(d=>{ const ts=aggregate(d.iso); const m={}; ts.forEach(t=>m[t.bu]=(m[t.bu]||0)+(t.revD||0)); return m; });
  const head=['date','delivered_rev_per_truck_day','delivered_fleet_revenue','active_trucks','vs_band','gta_rev','tents_rev','east_rev','west_rev'];
  const lines=[head.join(',')].concat(days.map((d,i)=>{ const m=perBU[i];
    return [d.iso,Math.round(d.revTd),d.fleetRev,d.fleetTrucks,(d.revTd>=target?'at_or_above':'below'),
      Math.round(m['GTA']||0),Math.round(m['GTA Tents']||0),Math.round(m['East']||0),Math.round(m['West']||0)].join(','); }));
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='delivered-rev-per-truck-day-28d.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ============================== render ============================== */
function card(k,flag,v,sub,subColor){
  return '<div class="card"><div class="k"><span>'+k+'</span>'+(flag?'<span>'+flag+'</span>':'')+'</div>'+
    '<div class="v">'+v+'</div>'+(sub?'<div class="csub" style="color:'+(subColor||'var(--element-muted)')+'">'+sub+'</div>':'')+'</div>';
}

function render(){
  const content=document.getElementById('content');
  const all=aggregate(curDate);
  if(!all.length){
    content.innerHTML='<div class="empty">No routes found for '+curDate+'.<br>Pick another date above.</div>';
    return;
  }
  const buCounts={}; all.forEach(t=>{ buCounts[t.bu]=(buCounts[t.bu]||0)+1; });
  if(STATE.bu!=='All' && !buCounts[STATE.bu]) STATE.bu='All';
  const scope=STATE.bu, scopeLabel=scope==='All'?'Fleet':scope;
  const M=scopeMetrics(scope);
  const target=M.target;

  // ---- BU chips (same component as the tracker) ----
  let chips=BU_CHIPS.map(p=>{ const val=p[0],lbl=p[1]; const n=(val==='All')?all.length:(buCounts[val]||0);
    if(val!=='All'&&n===0) return '';
    return '<div class="bu-chip'+(scope===val?' active':'')+'" data-bu="'+esc(val)+'">'+lbl+' <span class="bu-n">'+n+'</span></div>'; }).join('');
  if((buCounts['Other']||0)>0) chips+='<div class="bu-chip'+(scope==='Other'?' active':'')+'" data-bu="Other">Other <span class="bu-n">'+buCounts['Other']+'</span></div>';
  const buRow='<div class="bu-row"><span class="bu-label">Business Unit</span>'+chips+'</div>';

  // ---- data-quality banner ----
  const banner='<div class="banner"><span class="ico">&#9201;</span>'+
    '<div class="txt"><b>Labour hours captured for '+M.nHrs+' of '+M.trucks+' trucks'+(scope==='All'?'':' ('+esc(scope)+')')+'.</b> '+
    'Rev/hr, on-target and overtime are suppressed until hours coverage improves.</div>'+
    '<span class="cov">Coverage '+M.cov+'% &#9651;</span></div>';

  // ---- KPI strip ----
  const revDelta=Math.round((M.revTd/target-1)*100);
  const kpis='<div class="dash">'+
    card('Rev / truck-day','',money(M.revTd),(revDelta>=0?'▲ '+revDelta:'▼ '+Math.abs(revDelta))+'% vs target',revDelta>=0?'var(--green)':'var(--red)')+
    card('Outbound fill','',M.avgD!=null?M.avgD+'%':'—',M.avgD!=null?((M.avgD>=55?'▲ ':'▼ ')+Math.abs(M.avgD-55)+' pts vs target'):'△ needs cube capacity',M.avgD==null?'var(--element-muted)':M.avgD>=55?'var(--green)':'var(--red)')+
    card('Backhaul recovery','',M.bh!=null?M.bh+'%':'—',M.bh!=null?((M.bh>=60?'▲ ':'▼ ')+Math.abs(M.bh-60)+' pts vs target'):'△ needs cube capacity',M.bh==null?'var(--element-muted)':M.bh>=60?'var(--green)':M.bh>=45?'var(--yellow)':'var(--red)')+
    card('Stops / truck','',fmt1(M.stopsPer),'drop density △ needs miles','var(--element-muted)')+
    card('Truck utilization','△',M.trucks+' active','△ fleet roster needed for %','var(--element-muted)')+
    card('On-time %','△','—','needs delivery windows','var(--element-muted)')+
  '</div>';

  // ---- 28-day delivered rev/truck-day chart ----
  const series=buildSeries(scope);
  OPSCTX={series,target,scopeLabel};
  // Stacked bars: delivery (teal) on the bottom, pickup (warm) on top. Delivery on
  // the bottom keeps its top edge = delivered rev/truck-day, so the dashed target
  // band line still reads cleanly against the delivery segment.
  const COL_D='var(--element-teal-mid)', COL_P='#C68A3A';
  const viewMax=Math.max(target,...series.map(d=>d.dTd+d.pTd))*1.12||1;
  const tb=Math.round(target/viewMax*OPS_MAXH);
  let bars='';
  series.forEach(d=>{ const dH=Math.round(d.dTd/viewMax*OPS_MAXH), pH=Math.round(d.pTd/viewMax*OPS_MAXH);
    const isSel=STATE.selDay===d.i;
    bars+='<div class="bar" data-bar="'+d.i+'" title="'+esc(d.label+' · Delivery '+money(d.dTd)+' · Pickup '+money(d.pTd))+'" '+
      'style="height:'+Math.max(4,dH+pH)+'px;opacity:'+((STATE.selDay!=null&&!isSel)?0.45:1)+';'+(isSel?'outline:2px solid var(--element-teal);outline-offset:1px;':'')+'">'+
        '<div class="seg" style="height:'+pH+'px;background:'+COL_P+';"></div>'+
        '<div class="seg" style="height:'+dH+'px;background:'+COL_D+';"></div></div>'; });
  const chart='<div class="panel"><div class="phead"><h3>Revenue per truck-day — Delivery + Pickup · 28d</h3>'+
      '<button class="btn ghost sm" id="csvBtn" title="Download the 28-day series as CSV">&#8595; Export CSV</button></div>'+
    '<div class="chart"><div class="tip" id="trendTip"></div>'+
      '<div class="bars" id="trendBars"><div class="tgt" style="bottom:'+tb+'px;"></div>'+bars+'</div></div>'+
    '<div class="legend"><span><span class="sw" style="background:'+COL_D+';"></span>Delivery</span>'+
      '<span><span class="sw" style="background:'+COL_P+';"></span>Pickup</span>'+
      '<span><span class="sw" style="border-top:2px dashed var(--element-muted);height:0;width:14px;"></span>delivered target</span>'+
      '<span style="margin-left:auto;">hover for detail · click a day to see its trucks</span></div></div>';

  // ---- by business unit ----
  let buRows='';
  BU_ORDER.filter(b=>buCounts[b]).forEach(b=>{ const m=scopeMetrics(b); const active=b===scope;
    const bhTag=m.bh==null?'n':m.bh>=60?'g':m.bh>=40?'y':'r';
    buRows+='<tr class="clickable'+(active?' active-bu':'')+'" data-burow="'+esc(b)+'">'+
      '<td><strong>'+esc(b)+'</strong></td>'+
      '<td class="num">'+m.trucks+'</td>'+
      '<td class="num">'+money(m.revTd)+'</td>'+
      '<td class="num">'+(m.avgD!=null?m.avgD+'%':'—')+'</td>'+
      '<td class="num"><span class="tag '+bhTag+'">'+(m.bh!=null?m.bh+'%':'—')+'</span></td></tr>'; });
  const buCard='<div class="panel"><div class="phead"><h3>By business unit</h3><span class="psub" style="margin:0;">click a row to filter</span></div>'+
    '<table><thead><tr><th>Unit</th><th class="num">Trucks</th><th class="num">Rev/TD</th><th class="num">Out fill</th><th class="num">Backhaul</th></tr></thead>'+
    '<tbody>'+buRows+'</tbody></table></div>';

  // ---- day drill-in: that day's trucks ----
  let drill='';
  if(STATE.selDay!=null){
    const d=series.find(x=>x.i===STATE.selDay);
    if(d){
      const dayTs=aggregate(d.iso).filter(t=>scope==='All'||t.bu===scope).slice().sort((a,b)=>(b.revD||0)-(a.revD||0));
      const over=d.revTd>=target;
      let rows=dayTs.map(t=>{ const gap=(t.dFill!=null&&t.pFill!=null)?(t.dFill-t.pFill):null;
        return '<tr><td><strong>'+esc(t.truck)+'</strong></td><td style="color:var(--element-muted)">'+esc(t.bu)+'</td>'+
          '<td class="num">'+money(t.revD)+'</td><td class="num">'+t.stops+'</td>'+
          '<td class="num">'+(t.dFill!=null?t.dFill+'%':'—')+'</td>'+
          '<td class="num">'+(gap!=null?(gap>0?'<span class="tag r">+'+gap+'</span>':gap):'—')+'</td></tr>'; }).join('');
      drill='<div class="panel" style="margin-bottom:16px;border-color:var(--element-teal-mid);">'+
        '<div class="phead"><h3>Trucks on '+esc(d.label)+' &middot; '+esc(scopeLabel)+
          ' <span class="tag '+(over?'g':'r')+'" style="margin-left:6px;">'+money(d.revTd)+'/truck-day</span></h3>'+
          '<div style="display:flex;gap:10px;align-items:center;"><a class="btn ghost sm" href="/tracker.html">Open in Tracker →</a>'+
          '<button class="btn ghost sm" id="drillClose">&times; Close</button></div></div>'+
        '<div class="psub">'+dayTs.length+' trucks · delivered '+money(d.scopeRev)+' (revenue shown is delivered)</div>'+
        '<div class="tbl-scroll"><table><thead><tr><th>Truck</th><th>BU</th><th class="num">Delivered $</th><th class="num">Stops</th><th class="num">Out fill</th><th class="num">Backhaul gap</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table></div></div>';
    }
  }

  // ---- cube utilization gauges ----
  const gauge=(label,val,tgt)=>{ const color=val!=null&&val>=tgt?'var(--green)':'var(--red)';
    return '<div class="gauge"><div class="lab"><span class="n">'+label+'</span>'+
      '<span class="val" style="color:'+color+'">'+(val!=null?val+'%':'—')+'<span style="font-size:11px;color:var(--element-muted);font-weight:600;"> / '+tgt+'% target</span></span></div>'+
      '<div class="track"><div class="tick" style="left:'+Math.min(100,tgt)+'%;"></div><div class="fill" style="width:'+Math.min(100,val||0)+'%;background:'+color+';"></div></div></div>'; };
  const gauges='<div class="panel"><h3 style="margin-bottom:14px;">Cube utilization</h3>'+
    gauge('Avg outbound fill',M.avgD,55)+gauge('Avg return (backhaul) fill',M.avgP,33)+
    '<div class="gauge note">Outbound <b style="color:var(--element-ink);">'+(M.avgD!=null?M.avgD+'%':'—')+'</b> · backhaul <b style="color:var(--element-ink);">'+(M.avgP!=null?M.avgP+'%':'—')+'</b> — vs the 55% / 33% targets.</div></div>';

  // ---- worst backhaul gaps ----
  const gaps=M.ts.filter(t=>t.dFill!=null&&t.pFill!=null&&(t.dFill-t.pFill)>0)
    .map(t=>({truck:t.truck,bu:t.fillBU||t.bu,deliv:t.dFill,pickup:t.pFill,gap:t.dFill-t.pFill,lost:(t.dFill-t.pFill)/100*M.revTd}))
    .sort((a,b)=>b.gap-a.gap).slice(0,6);
  let gapRows;
  if(gaps.length){ gapRows=gaps.map(r=>'<tr><td><strong>'+esc(r.truck)+'</strong></td><td style="color:var(--element-muted)">'+esc(r.bu||'')+'</td>'+
    '<td class="num">'+r.deliv+'%</td><td class="num" style="color:var(--element-muted)">'+r.pickup+'%</td>'+
    '<td class="num"><strong style="color:var(--red)">+'+r.gap+'</strong></td><td class="num" style="color:var(--element-muted)">~'+moneyK(r.lost)+'</td></tr>').join('');
  } else { gapRows='<tr><td colspan="6" style="text-align:center;color:var(--element-muted);padding:18px;">No out-full / back-empty trucks for '+esc(scopeLabel)+' today.</td></tr>'; }
  const gapsCard='<div class="panel"><div class="phead"><h3>Worst backhaul gaps today</h3><span class="psub" style="margin:0;">top 6 by gap</span></div>'+
    '<p class="psub">Out full → back empty — candidates to pair with a return run.</p>'+
    '<div class="tbl-scroll"><table><thead><tr><th>Truck</th><th>BU</th><th class="num">Deliv</th><th class="num">Pickup</th><th class="num">Gap</th><th class="num">Lost cap △</th></tr></thead>'+
    '<tbody>'+gapRows+'</tbody></table></div></div>';

  content.innerHTML = buRow+banner+kpis+'<div class="grid2">'+chart+buCard+'</div>'+drill+'<div class="grid-util">'+gauges+gapsCard+'</div>';
  wire();
}

// Lightweight hover: position/fill the tooltip + dim bars without rebuilding the DOM.
function updateHover(){
  if(!OPSCTX) return;
  const tip=document.getElementById('trendTip');
  document.querySelectorAll('#trendBars [data-bar]').forEach(b=>{ const i=+b.dataset.bar, isSel=STATE.selDay===i, isHov=STATE.hoverIdx===i;
    b.style.opacity=((STATE.hoverIdx!=null||STATE.selDay!=null)&&!isHov&&!isSel)?0.45:1; });
  if(!tip) return;
  if(STATE.hoverIdx==null){ tip.style.display='none'; return; }
  const d=OPSCTX.series.find(x=>x.i===STATE.hoverIdx); if(!d){ tip.style.display='none'; return; }
  const over=d.dTd>=OPSCTX.target;
  tip.style.left=Math.min(92,Math.max(8,(STATE.hoverIdx/(TREND_DAYS-1))*100))+'%';
  tip.style.display='block';
  tip.innerHTML='<div class="d">'+esc(d.label)+'</div><div class="big">'+money(d.dTd+d.pTd)+'<span style="font-size:11px;opacity:.6;font-weight:500;"> /truck-day</span></div>'+
    '<div class="row"><span style="opacity:.7;"><span style="color:var(--element-mint);">●</span> Delivery</span><span>'+money(d.dTd)+'</span></div>'+
    '<div class="row" style="margin-top:2px;"><span style="opacity:.7;"><span style="color:#e0a96a;">●</span> Pickup</span><span>'+money(d.pTd)+'</span></div>'+
    '<div class="row" style="margin-top:2px;"><span style="opacity:.7;">Active trucks</span><span>'+d.scopeTrucks+'</span></div>'+
    '<div class="row" style="margin-top:5px;font-weight:700;color:'+(over?'var(--element-mint)':'#ec9a93')+';">● delivery '+(over?'at / above band':'below band')+'</div>';
}

function wire(){
  document.querySelectorAll('[data-bu]').forEach(b=>b.onclick=()=>{ STATE.bu=b.dataset.bu; STATE.selDay=null; render(); });
  document.querySelectorAll('[data-burow]').forEach(b=>b.onclick=()=>{ const v=b.dataset.burow; STATE.bu=(STATE.bu===v?'All':v); STATE.selDay=null; render(); });
  document.querySelectorAll('#trendBars [data-bar]').forEach(b=>{ const i=+b.dataset.bar;
    b.onmouseenter=()=>{ STATE.hoverIdx=i; updateHover(); };
    b.onmouseleave=()=>{ STATE.hoverIdx=null; updateHover(); };
    b.onclick=()=>{ STATE.hoverIdx=null; STATE.selDay=(STATE.selDay===i?null:i); render(); };
  });
  const csv=document.getElementById('csvBtn'); if(csv) csv.onclick=exportCsv;
  const dc=document.getElementById('drillClose'); if(dc) dc.onclick=()=>{ STATE.selDay=null; render(); };
}

/* ============================== boot ============================== */
function setupDates(){
  const dates=Object.keys(DATA.routes||{}).sort();
  const dp=document.getElementById('datePick');
  if(dates.length){ dp.min=dates[0]; dp.max=dates[dates.length-1]; }
  const today=localToday();
  const past=dates.filter(d=>d<=today);
  curDate=(DATA.routes&&DATA.routes[today])?today:(past.length?past[past.length-1]:(dates.length?dates[dates.length-1]:today));
  dp.value=curDate;
  dp.addEventListener('change', ()=>{ curDate=dp.value; STATE.selDay=null; STATE.hoverIdx=null; render(); });
}

(async function(){
  try{
    const res=await fetch('dispatch_data.json?v='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA=await res.json();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty">Could not load dispatch data ('+e.message+').<br>If you are signed out, <a href="/">reload the map</a> and sign in, then return here.</div>';
    return;
  }
  try{ const pwRes=await fetch('driver_hours.json?v='+Date.now(), {cache:'no-store'}); if(pwRes.ok){ PW=await pwRes.json(); buildPwIndex(); } }
  catch(e){ console.warn('driver_hours.json unavailable:', e.message); }
  try{ const clRes=await fetch('contract_load.json?v='+Date.now(), {cache:'no-store'}); if(clRes.ok){ LOAD=await clRes.json(); } }
  catch(e){ console.warn('contract_load.json unavailable — fill metrics will read —:', e.message); }
  setupDates();
  render();
})();
</script>
